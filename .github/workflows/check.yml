name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned Rust version
        id: rust-version
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-09-11
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: clippy,rustfmt,llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Rust coverage tool
        run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - name: Check Rust
        env:
          MOSAIC_COVERAGE: '1'
        run: bash scripts/check-rust.sh
      - name: Verify lockfiles unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml
      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: coverage/rust.lcov
          if-no-files-found: warn
          retention-days: 14

  ui:
    name: UI checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          bash scripts/check-toolchain.sh node
          pnpm install --frozen-lockfile
          git diff --exit-code -- Cargo.lock pnpm-lock.yaml
      - name: Verify build input contracts
        run: node --test scripts/build-inputs.test.mjs
      - name: Check TypeScript
        run: pnpm --dir ui lint
      - name: Check formatting and lint
        run: pnpm --dir ui check:biome
      - name: Run unit and component tests with coverage
        run: pnpm --dir ui coverage unit
      - name: Verify lockfiles unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml
      - name: Upload unit coverage maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-coverage-maps-unit
          path: ui/.nyc_output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E ${{ matrix.browser == 'chrome' && 'Chrome' || 'WebKit' }} (${{ matrix.shard }}/2)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          bash scripts/check-toolchain.sh node
          pnpm install --frozen-lockfile
          git diff --exit-code -- Cargo.lock pnpm-lock.yaml
      # Video recording needs FFmpeg even when Chrome comes preinstalled on the runner.
      - name: Install Playwright video encoder
        run: pnpm --dir ui exec playwright install ffmpeg
      - name: Install WebKit test browser
        if: matrix.browser == 'webkit'
        run: pnpm --dir ui exec playwright install webkit
      - name: Run E2E shard
        run: pnpm --dir ui coverage e2e --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2 --workers=1
      - name: Verify lockfiles unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml
      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload E2E coverage maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-coverage-maps-${{ matrix.browser }}-${{ matrix.shard }}
          path: ui/.nyc_output/
          include-hidden-files: true
          # Only flows.spec.ts collects browser coverage; other shards can have no maps.
          if-no-files-found: ignore
          retention-days: 1

  ui-coverage:
    name: UI coverage
    needs: [ui, e2e]
    if: always() && !cancelled()
    runs-on: macos-15
    steps:
      - name: Require all UI checks and E2E shards to pass
        env:
          UI_RESULT: ${{ needs.ui.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$UI_RESULT" = success && test "$E2E_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          bash scripts/check-toolchain.sh node
          pnpm install --frozen-lockfile
          git diff --exit-code -- Cargo.lock pnpm-lock.yaml
      - name: Download unit and E2E coverage maps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ui-coverage-maps-*
          path: ui/.nyc_output/
          merge-multiple: true
      - name: Report and enforce combined UI coverage
        run: pnpm --dir ui coverage report
      - name: Verify lockfiles unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml
      - name: Upload UI coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-coverage
          path: ui/coverage/
          if-no-files-found: warn
          retention-days: 14
