name: Dependency audit
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - Cargo.lock
      - '**/package.json'
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - rust-toolchain.toml
      - .nvmrc
      - .github/workflows/dependency-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Read pinned Rust version
        id: rust-version
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-09-11
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - name: Install pinned audit tool
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit both lockfiles
        run: bash scripts/audit-dependencies.sh
      - name: Retain findings including scanner failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: target/dependency-audit/
          if-no-files-found: error
          retention-days: 90
