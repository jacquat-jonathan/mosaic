name: Performance report
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    name: Reference performance report
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned Rust version
        id: rust-version
        run: echo "version=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install pinned dependencies
        run: |
          bash scripts/check-toolchain.sh
          pnpm install --frozen-lockfile
          git diff --exit-code -- Cargo.lock pnpm-lock.yaml
      - name: Check comparator and reporting contracts
        run: node --test scripts/performance/report.test.mjs
      - name: Measure core fixtures five times
        run: node scripts/performance/report.mjs core target/performance
      - name: Measure headless Chrome mock journeys
        run: pnpm --dir ui exec playwright test --config playwright.perf.config.ts
      - name: Build production assets
        run: node scripts/performance/report.mjs build
      - name: Record distributions, tools and bundle sizes
        run: |
          node scripts/performance/report.mjs report target/performance
          cat target/performance/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Compare previous successful reference run when compatible
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous=$(gh run list --workflow performance.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$previous" ]; then
            echo 'No previous successful reference run; this is the first baseline.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run download "$previous" --name performance-report --dir target/performance-baseline
          if ! node scripts/performance/report.mjs compare target/performance-baseline/report.json target/performance/report.json > target/performance/comparison.json 2> target/performance/comparison-error.log; then
            echo '### Comparison unavailable (measurements retained)' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat target/performance/comparison-error.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '### Provisional comparison (reporting only)' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat target/performance/comparison.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain measurements and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-report
          path: target/performance/
          if-no-files-found: error
          retention-days: 90
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-browser-failures
          path: ui/test-results/
          if-no-files-found: ignore
          retention-days: 14
