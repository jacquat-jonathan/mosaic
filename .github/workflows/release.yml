name: Universal macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
# Each job asks for what it needs. Third-party actions are pinned by commit; Dependabot bumps them.
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate exact release source and green main merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          node scripts/release-preflight.mjs "$GITHUB_REF_NAME"
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Installs every npm and Cargo dependency and runs their build scripts and tests, so it gets no
  # secrets and can't publish. Its output is the unsigned release assets.
  build:
    needs: preflight
    runs-on: macos-15
    permissions:
      contents: read
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-09-11
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy,rustfmt
      - id: version
        run: echo "version=$(node -p 'JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json")).version')" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install WebKit test browser
        run: pnpm --dir ui exec playwright install webkit
      - name: Test before publishing
        run: bash scripts/check.sh
      - name: Build universal app
        run: bash scripts/install.sh --universal --build-only
      - name: Package (unsigned)
        run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: target/releases/v${{ steps.version.outputs.version }}/
          if-no-files-found: error
          retention-days: 7

  # Holds the release signing key, the trust root of every installed Mosaic's updates. It runs in
  # the protected `release` environment (a reviewer approves each run), installs no dependencies
  # and never executes what the build produced: sign-release.mjs only checks hashes and signs.
  sign:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Release only the tag that matches the version
        run: test "$GITHUB_REF" = "refs/tags/v$VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: target/releases/v${{ env.VERSION }}
      - name: Revalidate source and remote refs before signing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release-preflight.mjs "v$VERSION"
      - name: Sign the update manifest
        env:
          MOSAIC_RELEASE_PRIVATE_KEY: ${{ secrets.MOSAIC_RELEASE_PRIVATE_KEY }}
        run: node scripts/sign-release.mjs "target/releases/v$VERSION"
      - name: Publish only complete release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/recover-release-draft.mjs "v$VERSION" "target/releases/v$VERSION" --apply --publish
