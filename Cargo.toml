[workspace]
resolver = "3"
members = ["crates/mosaic-core", "crates/mosaic-cli", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mosaic-core = { path = "crates/mosaic-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
