[package]
name = "mosaic-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
localzone = { version = "0.3.1", default-features = false, features = ["win_zones"] }
notify = "8"
notify-debouncer-full = "0.7"
regex = "1.13.1"
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde.workspace = true
serde_json.workspace = true
serde_norway = "0.9.42"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror.workspace = true
trash = "5.2.9"
libc = "0.2"
uuid = { version = "1", features = ["serde", "v4"] }
unicode-normalization = "0.1.25"

specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "chrono"], optional = true }
specta-typescript = { version = "=0.0.12", optional = true }

[features]
# TypeScript types for the app's IPC bindings (src-tauri exports ui/src/ipc/bindings.ts).
specta = ["dep:specta", "dep:specta-typescript"]

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
