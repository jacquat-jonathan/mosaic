[package]
name = "mosaic-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test-only command surface; never enable for a release artifact.
native-smoke = []

[lib]
name = "mosaic_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
serde_json.workspace = true

[dependencies]
mosaic-core = { workspace = true, features = ["specta"] }
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2"
ed25519-dalek = "3.0"
base64 = "0.23"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
libc = "0.2"
tempfile = "3.27.0"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "rustls-tls"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSString", "NSArray", "NSData"] }
# Drag pasteboard access for dragging tree items out to Finder (src/drag_out.rs). Pinned to the
# versions Tauri's own macOS stack already uses.
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }

[dev-dependencies]
# Parses menu shortcuts in tests; the version Tauri's menus already use.
muda = { version = "0.20", default-features = false }
tauri = { version = "2.12", features = ["test"] }
tempfile = "3.27.0"
